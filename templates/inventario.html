<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventario del pañol</title><link rel="stylesheet" href="/static/inventario.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">Molinos Florencia</p><h1>Inventario del pañol</h1></div><button id="actualizar">Actualizar</button></header>
    <div id="alertas" aria-live="assertive"></div>
    <section class="panel"><table><thead><tr><th>Insumo</th><th>Categoría</th><th>Ubicación</th><th>Stock</th><th>Estado</th></tr></thead><tbody id="filas"></tbody></table></section>
  </main>
  <dialog id="detalle"><button class="cerrar" aria-label="Cerrar">×</button><p class="eyebrow">Detalle del insumo</p><h2 id="titulo"></h2>
    <dl id="caracteristicas"></dl><p class="fecha" id="fecha"></p>
    <form id="edicion"><label>Categoría<input name="categoria" required></label><label>Ubicación física<input name="ubicacion" required></label><div class="doble"><label>Mínimo<input name="minimo" type="number" min="0" step="0.001" required></label><label>Máximo<input name="maximo" type="number" min="0.001" step="0.001" required></label></div><div class="acciones"><button type="button" class="peligro" id="borrar">Eliminar producto</button><button type="submit">Guardar cambios</button></div></form>
  </dialog>
  <dialog id="confirmar"><h2>Eliminar producto</h2><p>Se borrará el insumo y todo su historial. Esta acción no se puede deshacer.</p><div class="acciones"><button id="cancelar">Cancelar</button><button class="peligro" id="confirmar-borrado">Sí, eliminar</button></div></dialog>
  <script src="/static/inventario.js"></script>
</body></html>
